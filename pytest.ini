[pytest]
testpaths = app/tests
pythonpath = .
addopts = --strict-markers
markers =
    unit: fast pure logic tests with no service/database boundary
    integration: database, API, service, or worker-boundary tests
    semantic: replay, policy simulation, event journal, and decision timeline contract tests
    live: requires running backend, worker, Redis, OpenClaw, or other local services
    slow: long-running tests that should stay out of the fast tier
    critical_regression: primary ownership for deterministic regression coverage
    product_contract: primary ownership for product behavior and user workflow coverage
    api_contract: primary ownership for HTTP, schema, and mobile API coverage
    integration_contract: primary ownership for service or infrastructure boundary coverage
    recovery: primary ownership for recovery, resume, restore, and idempotency coverage
    deployment: primary ownership for startup, image, and deployment contract coverage
    security: primary ownership for authentication, authorization, isolation, and destructive-safety coverage
    compatibility: primary ownership for backward-compatibility and migration coverage
    live_validation: primary ownership for supervised real-runtime validation
    evidence_historical: primary ownership for evidence and historical-certification coverage
